<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>GEPCO Mobile | HT/LT Works Hub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #eef2f5;
      font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      color: #1a2e2a;
    }

    /* --- LOGIN --- */
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 28, 20, 0.96);
      backdrop-filter: blur(16px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
    }

    .login-card {
      background: #ffffff;
      border-radius: 2rem;
      padding: 2rem 1.5rem;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 30px 40px -15px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .login-card h2 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #166534, #2b8c5a);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 0.25rem;
    }

    .login-card p {
      color: #4a6b5a;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }

    .login-input {
      width: 100%;
      padding: 0.9rem 1rem;
      margin: 0.5rem 0;
      border-radius: 60px;
      border: 1px solid #d0dfd4;
      font-size: 1rem;
      background: #fefcf7;
      transition: all 0.2s;
      outline: none;
    }

    .login-input:focus {
      border-color: #2b8c5a;
      box-shadow: 0 0 0 3px rgba(43, 140, 90, 0.2);
    }

    .login-btn {
      background: #1f6e48;
      color: white;
      border: none;
      width: 100%;
      padding: 0.85rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1rem;
      transition: all 0.2s;
    }

    .login-btn:active { transform: scale(0.97); background: #115c3c; }
    .error-msg { color: #c2412c; font-size: 0.7rem; margin-top: 0.7rem; min-height: 1em; }

    /* --- MAIN DASHBOARD --- */
    .dashboard-wrapper {
      display: none;
      background: #f4f9f4;
      min-height: 100vh;
      padding: 12px;
    }

    .dashboard-container {
      max-width: 100%;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      padding: 1rem;
    }

    .mobile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #e3efdf;
    }

    .title-badge h1 {
      font-size: 1.45rem;
      font-weight: 700;
      background: linear-gradient(145deg, #1c543c, #258a58);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      line-height: 1.2;
    }

    .title-badge p {
      font-size: 0.65rem;
      color: #5a7b68;
      font-weight: 500;
    }

    .stats-chip {
      background: #eef3ea;
      padding: 0.3rem 0.9rem;
      border-radius: 50px;
      font-size: 0.7rem;
      font-weight: 600;
      color: #226e48;
    }

    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.2rem;
    }

    .icon-btn {
      background: #f1f6ef;
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #1f543b;
      cursor: pointer;
      transition: 0.2s;
    }

    .icon-btn:active {
      background: #e2ecd9;
      transform: scale(0.96);
    }

    .exit-btn {
      background: #e9ece8;
      color: #3a5e4b;
    }
    .exit-btn:active { background: #d4dfce; }

    .modules-section-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #376e51;
      margin: 1rem 0 0.8rem 0.4rem;
      letter-spacing: -0.2px;
    }

    .modules-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 0.5rem 0 1rem 0;
    }

    .module-item {
      background: #ffffff;
      border: 1px solid #e2ecd9;
      border-radius: 28px;
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }

    .module-item:active {
      background: #f6fdf4;
      transform: scale(0.99);
      border-color: #b3d3bd;
    }

    .module-emoji {
      font-size: 2rem;
      background: #f3f9f0;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 30px;
    }

    .module-info {
      flex: 1;
    }

    .module-info h3 {
      font-size: 1rem;
      font-weight: 700;
      color: #1b3a2c;
      margin-bottom: 4px;
    }

    .module-info p {
      font-size: 0.7rem;
      color: #5f7c6b;
      line-height: 1.3;
    }

    .footer-note {
      margin-top: 1.2rem;
      text-align: center;
      font-size: 0.6rem;
      color: #87a396;
      padding-top: 0.7rem;
      border-top: 1px solid #e2ecd9;
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .new-tab-link {
      color: #1f6e48;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .new-tab-link:hover {
      color: #115c3c;
      text-decoration: underline;
    }

    .new-tab-link:active {
      transform: scale(0.98);
    }

    button, .module-item {
      touch-action: manipulation;
    }

    .new-tab-hint {
      font-size: 0.6rem;
      color: #6a8d7a;
      background: #f3f9f0;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      display: inline-block;
      margin-top: 0.5rem;
    }

    @media (max-width: 450px) {
      .dashboard-container {
        padding: 0.8rem;
      }
      .title-badge h1 {
        font-size: 1.25rem;
      }
      .icon-btn {
        padding: 0.5rem 0.9rem;
        font-size: 0.75rem;
      }
      .module-emoji {
        width: 46px;
        height: 46px;
        font-size: 1.7rem;
      }
      .module-info h3 {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginOverlay" class="login-overlay">
  <div class="login-card">
    <h2>⚡ GEPCO</h2>
    <p>HT/LT Works · Field Command</p>
    <input type="text" id="loginUser" class="login-input" placeholder="Username" autocomplete="off" inputmode="text">
    <input type="password" id="loginPass" class="login-input" placeholder="Password" autocomplete="off">
    <button id="loginBtn" class="login-btn" type="button">Access Dashboard →</button>
    <div id="loginError" class="error-msg"></div>
    <div style="margin-top: 0.8rem; font-size: 0.6rem; color: #86a392;">authorized personnel only</div>
  </div>
</div>

<!-- MAIN DASHBOARD -->
<div id="mainDashboard" class="dashboard-wrapper">
  <div class="dashboard-container">
    <div class="mobile-header">
      <div class="title-badge">
        <h1>🔌 HT/LT Works</h1>
        <p>GEPCO · real‑time monitoring</p>
      </div>
      <div class="stats-chip">📋 10 modules</div>
    </div>

    <div class="action-row">
      <button id="backButton" class="icon-btn" aria-label="Go back">← Go back</button>
      <button id="logoutButton" class="icon-btn exit-btn" aria-label="Exit dashboard">🚪 Exit</button>
    </div>

    <div class="modules-section-title">📌 Monitoring modules · opens in new tab</div>
    <div class="modules-list" id="modulesListContainer"></div>

    <div style="text-align: center;">
      <span class="new-tab-hint">↩️ Each new tab includes a "Go back" button</span>
    </div>

    <div class="footer-note">
      <span>© GEPCO Infrastructure</span>
      <a href="#" id="openNewTabLink" class="new-tab-link" target="_blank">🔗 Open LS Site Report in New Tab</a>
      <span>🔐 secure viewer</span>
    </div>
  </div>
</div>

<script>
  // ================================================================
  // CREDENTIALS
  // ================================================================
  var VALID_USER = "admin";
  var VALID_PASS = "gepco2025";

  var LS_REPORT_URL = "https://script.google.com/macros/s/AKfycbwDTf9jaLe17B0P9TS3lTBrzymJGG09m0Gt2aQDHz5ud9bBYpJi2-hETr0t_v1lSGy6Eg/exec";

  // In-memory auth flag (avoids localStorage issues on file:// / private mode)
  var isAuthenticated = false;

  // ================================================================
  // MODULE DATA
  // ================================================================
  var modulesDataset = [
    { name: "LS Site Report", icon: "📋", desc: "Pre-commencement safety & line survey · compliance", url: LS_REPORT_URL },
    { name: "Live LT/HT Works", icon: "⚡", desc: "Active sites · stringing, pole erection, transformer", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTwSDDDu_s17e4fBcY8x1kep8pCG-r2L2rYkwFvYJQlzyNc__--nOHGWExfNzlKNbwcVRJHkuLCBlUP/pubhtml?gid=2011569225&single=true" },
    { name: "Completed Works", icon: "✅", desc: "Final commissioning & closure certifications", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTwSDDDu_s17e4fBcY8x1kep8pCG-r2L2rYkwFvYJQlzyNc__--nOHGWExfNzlKNbwcVRJHkuLCBlUP/pubhtml?gid=1624422104&single=true" },
    { name: "Sub Division Wise Works", icon: "🗺️", desc: "City, Rural, Industrial subdivision filters", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTwSDDDu_s17e4fBcY8x1kep8pCG-r2L2rYkwFvYJQlzyNc__--nOHGWExfNzlKNbwcVRJHkuLCBlUP/pubhtml?gid=270755340&single=true" },
    { name: "HT Line Breakdowns", icon: "⚠️", desc: "Fault alerts, restoration, feeder downtime", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTwSDDDu_s17e4fBcY8x1kep8pCG-r2L2rYkwFvYJQlzyNc__--nOHGWExfNzlKNbwcVRJHkuLCBlUP/pubhtml?gid=0&single=true" },
    { name: "LT Consumer Requests", icon: "🏠", desc: "New connections, service lines, meters", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTwSDDDu_s17e4fBcY8x1kep8pCG-r2L2rYkwFvYJQlzyNc__--nOHGWExfNzlKNbwcVRJHkuLCBlUP/pubhtml" },
    { name: "Feeder wise Load Mgmt", icon: "📊", desc: "Peak load analytics & overloading alerts", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTwSDDDu_s17e4fBcY8x1kep8pCG-r2L2rYkwFvYJQlzyNc__--nOHGWExfNzlKNbwcVRJHkuLCBlUP/pubhtml" },
    { name: "Transformer Health", icon: "🔧", desc: "Oil levels, thermal, maintenance schedule", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTwSDDDu_s17e4fBcY8x1kep8pCG-r2L2rYkwFvYJQlzyNc__--nOHGWExfNzlKNbwcVRJHkuLCBlUP/pubhtml" },
    { name: "Urdu Safety Instructions", icon: "📦", desc: "Cable, poles, conductor stock status", url: "https://docs.google.com/document/d/e/2PACX-1vRhKBb5PBQQ9YNczudK6FmP20gqwnuJOmZ0CgbDwUOMEIkZpGVG-YVyZFytgXPmTn9Ep34s-DJ7fwOJ/pub" },
    { name: "GEPCO Safety Manual", icon: "📈", desc: "HT/LT achievements, contractor performance", url: "https://docs.google.com/document/d/e/2PACX-1vTRbEPzvVlhLJHCnRP6IUczZ6a7HXba5bkbepNkLUp3hpY8q40Hux0WIx8PO7hlUg/pub" }
  ];

  // ================================================================
  // OPEN MODULE IN NEW TAB (with Go-back button)
  // ================================================================
  function openModuleInNewTab(moduleUrl, moduleName) {
    var wrapperHtml = ''
      + '<!DOCTYPE html>'
      + '<html>'
      + '<head>'
      + '<meta charset="UTF-8">'
      + '<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">'
      + '<title>' + moduleName + ' · GEPCO</title>'
      + '<style>'
      + '* { margin:0; padding:0; box-sizing:border-box; }'
      + 'body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#f4f9f4; display:flex; flex-direction:column; height:100vh; }'
      + '.top-bar { background:#fff; padding:0.8rem 1rem; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #d0e2d4; box-shadow:0 2px 8px rgba(0,0,0,0.03); flex-shrink:0; gap:12px; flex-wrap:wrap; }'
      + '.back-btn { background:#1f6e48; color:#fff; border:none; padding:0.6rem 1.2rem; border-radius:60px; font-weight:600; font-size:0.9rem; cursor:pointer; display:inline-flex; align-items:center; gap:6px; box-shadow:0 2px 6px rgba(0,0,0,0.1); transition:0.2s; }'
      + '.back-btn:active { background:#115c3c; transform:scale(0.96); }'
      + '.back-btn:hover { background:#115c3c; }'
      + '.title { font-weight:600; color:#1c543c; font-size:1rem; display:flex; align-items:center; gap:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; text-align:right; }'
      + '.iframe-container { flex:1; width:100%; background:#fff; overflow:hidden; }'
      + 'iframe { width:100%; height:100%; border:none; display:block; }'
      + '.small-note { font-size:0.65rem; color:#6a8d7a; text-align:center; padding:0.3rem; background:#fafefa; border-top:1px solid #e0eedb; }'
      + '@media (max-width:480px) { .back-btn { padding:0.5rem 1rem; font-size:0.8rem; } .title { font-size:0.8rem; } }'
      + '</style>'
      + '</head>'
      + '<body>'
      + '<div class="top-bar">'
      + '<button class="back-btn" id="goBackBtn">← Go back</button>'
      + '<div class="title">📄 ' + moduleName + '</div>'
      + '</div>'
      + '<div class="iframe-container">'
      + '<iframe src="' + moduleUrl + '" title="' + moduleName + '" sandbox="allow-same-origin allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation"></iframe>'
      + '</div>'
      + '<div class="small-note">↩️ Press "Go back" to return to dashboard</div>'
      + '<script>'
      + 'document.getElementById("goBackBtn").addEventListener("click", function() {'
      + '  window.close();'
      + '  setTimeout(function() { if (!window.closed) window.history.back(); }, 100);'
      + '});'
      + 'window.addEventListener("keydown", function(e) {'
      + '  if (e.key === "Escape") { window.close(); setTimeout(function() { if (!window.closed) window.history.back(); }, 100); }'
      + '});'
      + '<\/script>'
      + '</body>'
      + '</html>';

    try {
      var blob = new Blob([wrapperHtml], { type: 'text/html' });
      var blobUrl = URL.createObjectURL(blob);
      var newTab = window.open(blobUrl, '_blank');
      if (!newTab) {
        alert('Please allow pop-ups to open module in a new tab.');
      }
      setTimeout(function() { URL.revokeObjectURL(blobUrl); }, 60000);
    } catch (err) {
      // Fallback: open the URL directly if blob fails
      window.open(moduleUrl, '_blank');
    }
  }

  // ================================================================
  // RENDER MODULES
  // ================================================================
  function renderMobileModules() {
    var container = document.getElementById("modulesListContainer");
    if (!container) return;
    var itemsHtml = "";
    for (var i = 0; i < modulesDataset.length; i++) {
      var mod = modulesDataset[i];
      itemsHtml += '<div class="module-item" data-module-index="' + i + '">'
        + '<div class="module-emoji">' + mod.icon + '</div>'
        + '<div class="module-info">'
        + '<h3>' + mod.name + '</h3>'
        + '<p>' + mod.desc + '</p>'
        + '</div>'
        + '</div>';
    }
    container.innerHTML = itemsHtml;

    var items = document.querySelectorAll('.module-item');
    for (var j = 0; j < items.length; j++) {
      items[j].addEventListener('click', function () {
        var idx = parseInt(this.getAttribute('data-module-index'), 10);
        var target = modulesDataset[idx];
        if (target) {
          openModuleInNewTab(target.url, target.name);
        }
      });
    }
  }

  // ================================================================
  // LOGIN / LOGOUT
  // ================================================================
  function showMobileDashboard() {
    var loginOverlay = document.getElementById("loginOverlay");
    var mainDashboard = document.getElementById("mainDashboard");
    if (loginOverlay) loginOverlay.style.display = "none";
    if (mainDashboard) mainDashboard.style.display = "block";
    renderMobileModules();
  }

  function attemptLogin() {
    var userField = document.getElementById("loginUser");
    var passField = document.getElementById("loginPass");
    var errorSpan = document.getElementById("loginError");

    var username = userField ? userField.value.trim() : "";
    var password = passField ? passField.value.trim() : "";

    if (username === VALID_USER && password === VALID_PASS) {
      isAuthenticated = true;
      showMobileDashboard();
    } else {
      if (errorSpan) {
        errorSpan.innerText = "❌ Access denied · wrong credentials";
        setTimeout(function () { errorSpan.innerText = ""; }, 2500);
      }
    }
  }

  function logoutAndReset() {
    isAuthenticated = false;
    var mainDiv = document.getElementById("mainDashboard");
    var loginDiv = document.getElementById("loginOverlay");
    if (mainDiv) mainDiv.style.display = "none";
    if (loginDiv) loginDiv.style.display = "flex";

    var userField = document.getElementById("loginUser");
    var passField = document.getElementById("loginPass");
    if (userField) userField.value = "";
    if (passField) passField.value = "";
    var errorDiv = document.getElementById("loginError");
    if (errorDiv) errorDiv.innerText = "";
  }

  function handleBackButton() {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      alert('You are at the main dashboard. Use module buttons to open pages in new tabs.');
    }
  }

  function openInNewTab(event) {
    if (event) event.preventDefault();
    openModuleInNewTab(LS_REPORT_URL, "LS Site Report");
  }

  // ================================================================
  // EVENT BINDING
  // ================================================================
  function bindEvents() {
    var loginBtn = document.getElementById("loginBtn");
    var logoutBtn = document.getElementById("logoutButton");
    var backBtn = document.getElementById("backButton");
    var newTabLink = document.getElementById("openNewTabLink");

    if (loginBtn) {
      loginBtn.addEventListener("click", function (e) {
        e.preventDefault();
        attemptLogin();
      });
    }

    if (logoutBtn) logoutBtn.addEventListener("click", logoutAndReset);
    if (backBtn) backBtn.addEventListener("click", handleBackButton);
    if (newTabLink) newTabLink.addEventListener("click", openInNewTab);

    var userInput = document.getElementById("loginUser");
    var passInput = document.getElementById("loginPass");

    function handleEnter(e) {
      if (e.key === "Enter" || e.keyCode === 13) {
        e.preventDefault();
        attemptLogin();
      }
    }

    if (userInput) userInput.addEventListener("keypress", handleEnter);
    if (passInput) passInput.addEventListener("keypress", handleEnter);
  }

  // ================================================================
  // INIT
  // ================================================================
  function init() {
    bindEvents();
    // Always start at login screen
    document.getElementById("loginOverlay").style.display = "flex";
    document.getElementById("mainDashboard").style.display = "none";
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
</script>
</body>
</html>
